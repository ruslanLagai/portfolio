spring:
  config:
    import: file:.properties,optional:file:.private.properties

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.mysql.cj.jdbc.MysqlConnectionPoolDataSource
    url: jdbc:mysql://localhost:3307/portfolio

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: create-drop

tinkoff:
  api:
    token: ${TINKOFF_API_TOKEN}
    url: https://api-invest.tinkoff.ru/openapi

server:
  servlet:
    context-path:
  port: ${SPRING_DOCKER_PORT}
